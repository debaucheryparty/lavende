[workspace]
members = [
    "library",
    "src/cargo",
    "src/node",
    "src/go",
    "src/python",
]
exclude = [
    "_examples/rust",
]
resolver = "2"

[workspace.package]
version = "1.0.10"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true